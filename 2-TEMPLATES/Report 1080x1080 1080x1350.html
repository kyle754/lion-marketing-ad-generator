<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root{
    --primary:{{PRIMARY}};
    --primary-dark:{{PRIMARY_DARK}};
    --accent:{{ACCENT}};
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden}
  body{font-family:'Helvetica Neue','Avenir Next',system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .ad{position:relative;width:100vw;height:100vh;overflow:hidden;background:#002716;
    display:flex;align-items:center;justify-content:center}
  .ad::before{content:"";position:absolute;width:900px;height:900px;border-radius:50%;
    background:radial-gradient(circle,rgba(51,235,151,.20),transparent 60%);top:-240px;left:-240px}
  .safe{position:relative;z-index:4;width:1080px;height:1080px;display:flex;flex-direction:column;
    justify-content:center;align-items:flex-start;padding:0 96px}
  .logo{position:absolute;top:60px;left:96px;
    background:#fff;padding:10px 16px;border-radius:11px;box-shadow:0 8px 20px rgba(0,0,0,.32)}
  .logo .brand-logo{height:42px;display:block}
  .eyebrow{font-size:16px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
  .hook{font-size:58px;line-height:1.05;font-weight:800;color:#fff;letter-spacing:-.015em;max-width:820px}
  .body{margin-top:20px;font-size:24px;line-height:1.44;color:#a9c3b6;max-width:660px}
  .cta{margin-top:32px;display:inline-block;background:var(--accent);color:var(--primary-dark);font-size:22px;
    font-weight:800;padding:18px 36px;border-radius:12px}
  .card{margin-top:48px;align-self:center;width:760px;background:#fff;border-radius:18px;padding:30px 34px 26px;
    box-shadow:0 30px 70px rgba(0,0,0,.4)}
  .card h3{font-size:18px;color:#002716;font-weight:800;letter-spacing:.02em}
  .card .sub{font-size:14px;color:#94a3b8;margin-top:3px;margin-bottom:18px}
  .row{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-top:1px solid #eef2f7}
  .row .n{font-size:17px;color:#334155}
  .row .v{font-size:17px;font-weight:700;color:#002716}
  .row .v.cut{color:#dc2626}
  .total{margin-top:16px;background:#effef8;border:1px solid #c8f0dd;border-radius:13px;
    padding:16px 20px;display:flex;align-items:center;justify-content:space-between}
  .total .t{font-size:16px;font-weight:700;color:var(--primary)}
  .total .amt{font-size:32px;font-weight:800;color:var(--primary)}
</style>
</head>
<body>
  <div class="ad">
    <div class="safe">
      <div class="logo">{{LOGO}}</div>
      <div class="eyebrow">{{EYEBROW}}</div>
      <div class="hook">{{HOOK}}</div>
      <div class="body">{{BODY}}</div>
      <span class="cta">{{CTA}}</span>
      <div class="card">
        <h3>Campaign Performance Snapshot</h3>
        <div class="sub">Strategy + creative + media by {{BRAND_NAME}}</div>
        <div class="row"><span class="n">Campaign reach</span><span class="v">284K</span></div>
        <div class="row"><span class="n">Qualified leads</span><span class="v">+42%</span></div>
        <div class="row"><span class="n">Cost per lead</span><span class="v cut">-31%</span></div>
        <div class="total"><span class="t">{{STAT_LABEL}}</span><span class="amt">{{STAT}}</span></div>
      </div>
    </div>
  </div>
</body>
</html>
