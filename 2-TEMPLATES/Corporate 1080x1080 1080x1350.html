<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root{
    --primary:{{PRIMARY}};
    --primary-dark:{{PRIMARY_DARK}};
    --accent:{{ACCENT}};
    --ink:{{INK}};
    --muted:{{MUTED}};
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden}
  body{font-family:'Helvetica Neue','Avenir Next',system-ui,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  .ad{position:relative;width:100vw;height:100vh;background:#ffffff;display:flex;align-items:center;justify-content:center}
  /* content locked to centered 1080x1080 safe zone */
  .safe{position:relative;width:1080px;height:1080px;display:flex;flex-direction:column;
    justify-content:center;align-items:flex-start;padding:0 96px}
  .logo{position:absolute;top:64px;left:96px}
  .logo .brand-logo{height:48px;display:block}
  .eyebrow{display:inline-flex;align-items:center;gap:11px;font-size:17px;font-weight:700;
    letter-spacing:.16em;text-transform:uppercase;color:var(--primary);margin-bottom:26px}
  .eyebrow .dot{width:11px;height:11px;border-radius:50%;background:var(--accent)}
  .hook{font-size:66px;line-height:1.03;font-weight:800;color:var(--ink);letter-spacing:-.015em}
  .body{margin-top:26px;font-size:27px;line-height:1.42;color:var(--muted);max-width:760px}
  .cta{margin-top:40px;background:var(--accent);color:var(--primary-dark);font-size:24px;
    font-weight:800;padding:20px 40px;border-radius:13px;box-shadow:0 12px 28px rgba(0,39,22,.20)}
  .stat{margin-top:48px;width:100%;background:linear-gradient(135deg,var(--primary-dark),var(--primary));
    border-radius:18px;padding:30px 36px;display:flex;align-items:center;gap:32px;color:#fff}
  .stat .num{font-size:66px;font-weight:800;line-height:1;letter-spacing:-.03em}
  .stat .lbl{font-size:20px;font-weight:600;opacity:.9;letter-spacing:.02em}
  .stat .bars{margin-left:auto;display:flex;gap:8px;align-items:flex-end;height:70px}
  .stat .bars span{width:16px;background:rgba(255,255,255,.55);border-radius:3px 3px 0 0}
</style>
</head>
<body>
  <div class="ad">
    <div class="safe">
      <div class="logo">{{LOGO}}</div>
      <span class="eyebrow"><span class="dot"></span>{{EYEBROW}}</span>
      <div class="hook">{{HOOK}}</div>
      <div class="body">{{BODY}}</div>
      <div class="cta">{{CTA}}</div>
      <div class="stat">
        <div class="num">{{STAT}}</div>
        <div class="lbl">{{STAT_LABEL}}</div>
        <div class="bars">
          <span style="height:38%"></span><span style="height:56%"></span><span style="height:44%"></span>
          <span style="height:78%"></span><span style="height:62%"></span><span style="height:100%"></span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
